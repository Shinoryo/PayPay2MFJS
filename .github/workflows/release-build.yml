name: Release Build

permissions:
  contents: write

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify dry-run startup
        run: npm run import:paypay -- --csv="samples/paypay_sample.csv" --dry-run

      - name: Zip artifact
        run: |
          $TAG = "${{ github.event.release.tag_name }}"
          $ZIP_NAME = "paypay2mfjs-$TAG.zip"
          $ARTIFACTS = @(
            "src/*"
            "README.md"
            "LICENSE"
            "package.json"
            "package-lock.json"
            "config_sample.json"
            "samples/*"
          )
          Compress-Archive -Path $ARTIFACTS -DestinationPath $ZIP_NAME

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: paypay2mfjs-${{ github.event.release.tag_name }}.zip
